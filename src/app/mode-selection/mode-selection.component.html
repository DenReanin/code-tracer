<div class="mode-selection-container">
  <h2 class="mode-title">Bienvenido a CodeTracer</h2>
  <div class="mode-buttons">
    <button class="mode-btn" (click)="goToFreeMode()">
      <span class="icon">🧩</span>
      Modo Libre
      <div class="mode-desc">Explora y experimenta sin restricciones.</div>
    </button>
    <button class="mode-btn" (click)="goToExercises()">
      <span class="icon">🎯</span>
      Ejercicios
      <div class="mode-desc">Resuelve retos guiados paso a paso.</div>
    </button>
  </div>
</div>
